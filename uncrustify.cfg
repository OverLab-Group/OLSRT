# ---------------------------------------------------------------------------
# OLSRT uncrustify configuration
#
# uncrustify is used only as a fallback in ci/format_check.py when
# clang-format is not installed. The style matches .clang-format.
#
# Syntax: `option = value`, one per line. Comments start with #.
# ---------------------------------------------------------------------------

# ---- General --------------------------------------------------------------
newlines = lf
utf8_force = true

# ---- Indentation ----------------------------------------------------------
indent_with_tabs     = 0
indent_columns       = 4
indent_continue      = 4
indent_param         = 0
indent_switch_case   = 0
indent_case_brace    = 0
indent_class         = false
indent_namespace     = false
indent_paren_close   = 0
indent_paren_open_brace = false

# ---- Braces ---------------------------------------------------------------
# Attach: opening brace on the same line.
mod_full_brace_do      = add
mod_full_brace_for     = add
mod_full_brace_if      = add
mod_full_brace_while   = add
mod_full_brace_using   = remove

nl_do_brace        = remove
nl_else_brace       = remove
nl_elseif_brace     = remove
nl_for_brace        = remove
nl_if_brace         = remove
nl_while_brace      = remove
nl_switch_brace     = remove
nl_brace_else       = remove
nl_brace_while      = remove
nl_brace_finally    = remove
nl_finally_brace    = remove
nl_try_brace        = remove

nl_after_brace_open                 = false
nl_after_brace_open_cmt             = false
nl_after_vbrace_open                = false
nl_after_vbrace_open_empty          = false

# ---- Whitespace -----------------------------------------------------------
sp_arith            = force
sp_assign           = force
sp_assign_default   = force
sp_before_assign    = force
sp_after_assign     = force
sp_enum_assign      = force
sp_bool             = force
sp_compare          = force
sp_inside_paren     = remove
sp_paren_paren      = remove
sp_paren_brace      = force
sp_before_ptr_star  = remove
sp_after_ptr_star   = force
sp_between_ptr_star = remove
sp_after_byref      = remove
sp_before_byref     = remove
sp_before_sparen    = force
sp_inside_sparen    = remove
sp_after_sparen     = force
sp_sparen_brace     = force
sp_before_semi      = remove
sp_before_semi_for  = remove
sp_after_semi       = force
sp_before_square    = remove
sp_inside_square    = remove
sp_after_comma      = force
sp_before_comma     = remove
sp_after_cast       = remove
sp_inside_paren_cast = remove
sp_sizeof_paren     = remove
sp_inside_fparen    = remove
sp_inside_tparen    = remove
sp_after_tparen_close = remove
sp_inside_braces    = force
sp_inside_braces_empty = remove
sp_inside_braces_struct = force
sp_inside_braces_enum = force
sp_func_proto_paren = remove
sp_func_def_paren   = remove
sp_func_call_paren  = remove
sp_func_def_paren_empty = remove
sp_func_call_paren_empty = remove
sp_return_paren     = remove
sp_attribute_paren  = remove
sp_defined_paren    = remove

# ---- Alignment ------------------------------------------------------------
align_keep_tabs             = false
align_with_tabs             = false
align_on_tabstop            = false
align_number_left           = false
align_func_params           = true
align_var_def_span          = 0
align_var_def_star_style    = 1
align_var_def_amp_style     = 1
align_assign_span           = 0
align_typedef_span          = 0
align_typedef_star_style    = 1
align_typedef_amp_style     = 1
align_right_cmt_span        = 0
align_func_proto_span       = 0

# ---- Comments -------------------------------------------------------------
cmt_width           = 80
cmt_reflow_mode     = 0
cmt_indent_multi    = false
cmt_c_group         = false
cmt_c_nl_start      = false
cmt_c_nl_end        = false
cmt_cpp_group       = false
cmt_cpp_nl_start    = false
cmt_cpp_nl_end      = false
cmt_star_cont       = false
cmt_sp_before_star_cont = 0
cmt_sp_after_star_cont  = 1

# ---- Includes -------------------------------------------------------------
mod_sort_include        = false
include_category_0      = ''
include_category_1      = ''

# ---- Macros ---------------------------------------------------------------
pp_indent               = ignore
pp_space                = ignore
pp_space_count          = 0
pp_define_at_level      = false
pp_ignore_define_body   = false
